<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cockpit-Trader - KI-Analyse</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{--bg:#0a0e17;--card:#111827;--border:#1e2a3a;--text:#e2e8f0;--muted:#64748b;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--blue:#3b82f6;--cyan:#06b6d4;--white:#f1f5f9;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'SF Mono','Fira Code',monospace;min-height:100vh;}
.header{text-align:center;padding:20px 20px 14px;border-bottom:1px solid var(--border);}
.header h1{font-size:22px;letter-spacing:4px;text-transform:uppercase;background:linear-gradient(90deg,var(--cyan),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.header .ts{color:var(--muted);font-size:12px;margin-top:5px;}
.nav{display:flex;justify-content:center;gap:8px;padding:10px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.nav a{color:var(--muted);text-decoration:none;padding:6px 16px;font-size:12px;border-radius:6px;border:1px solid var(--border);letter-spacing:1px;transition:all .2s;}
.nav a.active{color:var(--text);background:rgba(59,130,246,0.15);border-color:var(--blue);}
.nav a:hover{color:var(--text);border-color:var(--muted);}
.main{max-width:1400px;margin:0 auto;padding:20px;}

/* Toolbar */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tab{padding:8px 18px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--muted);font-size:12px;font-family:inherit;letter-spacing:1px;cursor:pointer;transition:all .2s;min-height:44px;}
.tab.active{color:var(--text);background:rgba(59,130,246,0.15);border-color:var(--blue);}
.tab:hover:not(.disabled){color:var(--text);border-color:var(--muted);}
.tab.disabled{opacity:0.45;cursor:not-allowed;}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.controls label{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.controls select,.controls input{background:var(--card);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:12px;padding:8px 12px;border-radius:6px;min-height:36px;}
.controls select:focus,.controls input:focus{outline:none;border-color:var(--blue);}

/* Filter Buttons */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.filter-btn{padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--muted);font-size:11px;font-family:inherit;cursor:pointer;letter-spacing:1px;}
.filter-btn.active{color:var(--cyan);border-color:var(--cyan);background:rgba(6,182,212,0.08);}
.filter-btn:hover{color:var(--text);}
.phase-note{font-size:10px;color:var(--muted);font-style:italic;margin-left:8px;}

/* Layout: content + sticky TOC */
.content-wrap{display:grid;grid-template-columns:1fr 220px;gap:20px;align-items:start;}
.content{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px 30px;min-width:0;overflow-x:auto;}
.toc{position:sticky;top:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;font-size:12px;max-height:calc(100vh - 24px);overflow-y:auto;}
.toc-title{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:10px;}
.toc a{display:block;padding:6px 8px;color:var(--muted);text-decoration:none;border-left:2px solid transparent;font-size:11px;line-height:1.4;}
.toc a:hover,.toc a.active{color:var(--cyan);border-left-color:var(--cyan);background:rgba(6,182,212,0.05);}

/* Markdown styling */
.content h1{font-size:20px;letter-spacing:2px;color:var(--cyan);margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.content h2{font-size:15px;color:var(--text);margin:24px 0 10px;padding:8px 12px;background:rgba(59,130,246,0.08);border-left:3px solid var(--blue);border-radius:4px;scroll-margin-top:14px;}
.content h3{font-size:13px;color:var(--cyan);margin:18px 0 8px;letter-spacing:1px;}
.content h4{font-size:12px;color:var(--text);margin:14px 0 6px;}
.content p{font-size:13px;line-height:1.7;margin-bottom:10px;color:var(--text);}
.content strong{color:var(--white);}
.content em{color:var(--cyan);font-style:normal;}
.content ul,.content ol{margin:8px 0 14px 22px;}
.content li{font-size:13px;line-height:1.7;margin-bottom:4px;}
.content blockquote{border-left:3px solid var(--yellow);background:rgba(234,179,8,0.06);padding:8px 14px;margin:10px 0;color:var(--muted);font-size:12px;}
.content code{background:rgba(6,182,212,0.1);color:var(--cyan);padding:1px 6px;border-radius:3px;font-size:12px;font-family:inherit;}
.content pre{background:#000;border:1px solid var(--border);border-radius:6px;padding:12px;overflow-x:auto;margin:10px 0;}
.content pre code{background:none;padding:0;color:var(--text);}
.content hr{border:none;border-top:1px solid var(--border);margin:18px 0;}

/* Tables */
.content table{width:100%;border-collapse:collapse;margin:12px 0;font-size:12px;}
.content thead{background:rgba(59,130,246,0.1);}
.content th{padding:10px 12px;text-align:left;color:var(--cyan);letter-spacing:1px;font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--border);}
.content td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.04);color:var(--text);}
.content tr:hover td{background:rgba(59,130,246,0.04);}

/* Loading / Empty States */
.loading{text-align:center;padding:60px;color:var(--muted);}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px;border:1px dashed var(--border);border-radius:10px;}

/* Accordion (mobile) */
.accordion-header{display:none;width:100%;background:var(--card);border:1px solid var(--border);color:var(--cyan);font-family:inherit;font-size:12px;padding:12px 16px;text-align:left;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-radius:8px;margin-bottom:8px;min-height:44px;}
.accordion-header::after{content:' v';float:right;color:var(--muted);}
.accordion-header.expanded::after{content:' ^';}

/* Responsive */
@media(max-width:900px){
  .content-wrap{grid-template-columns:1fr;}
  .toc{display:none;}
  .accordion-header{display:block;}
  .content{padding:16px 18px;}
  .content table{display:block;overflow-x:auto;white-space:nowrap;}
}
@media(max-width:600px){
  .main{padding:12px;}
  .header h1{font-size:18px;}
  .content h1{font-size:17px;}
  .content h2{font-size:13px;}
  .tab{padding:10px 14px;font-size:11px;}
  .toolbar{flex-direction:column;align-items:stretch;}
}
</style>
</head>
<body>
<div class="header">
  <h1>Cockpit-Trader - KI-Analyse</h1>
  <div class="ts" id="ts">Lade Daten...</div>
</div>
<div class="nav">
  <a href="index.html">Dashboard</a>
  <a href="journal.html">Journal</a>
  <a href="ki-analyse.html" class="active">KI-Analyse</a>
  <a href="orders.html">Orders</a>
  <a href="indicators.html">Indicators</a>
  <a href="wiki.html">Wiki</a>
</div>

<div class="main">

  <div class="toolbar">
    <div class="tabs">
      <button class="tab active" id="tab-morning" onclick="switchTab('morning')">Morning</button>
      <button class="tab" id="tab-usupdate" onclick="switchTab('usupdate')" title="Erscheint nach 14:45">US-Update 14:45</button>
    </div>
    <div class="controls">
      <label for="date-select">Datum waehlen</label>
      <select id="date-select" onchange="onDateChange()"></select>
    </div>
  </div>

  <div class="filter-row">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">Alle</button>
    <button class="filter-btn" data-filter="freigabe" onclick="setFilter('freigabe')">Mit Freigabe</button>
    <button class="filter-btn" data-filter="konfidenz" onclick="setFilter('konfidenz')">Hohe Konfidenz (>0.4)</button>
    <span class="phase-note">Filter + Volltextsuche: Phase 3.2 in Arbeit</span>
  </div>

  <button class="accordion-header" id="toc-accordion" onclick="toggleToc()">Inhalt</button>

  <div class="content-wrap">
    <div class="content" id="content">
      <div class="loading">Lade Report...</div>
    </div>
    <aside class="toc" id="toc">
      <div class="toc-title">Inhalt</div>
      <div id="toc-list"></div>
    </aside>
  </div>
</div>

<script>
var STATE={tab:'morning',date:null,filter:'all',usupdateAvailable:false};

function pad2(n){return n<10?'0'+n:''+n;}
function todayIso(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}

function buildDateList(){
  var dates=[];var d=new Date();
  for(var i=0;i<30;i++){
    var iso=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
    dates.push(iso);
    d.setDate(d.getDate()-1);
  }
  return dates;
}

function reportPath(tab,date){
  var today=todayIso();
  if(date===today){
    return tab==='morning'?'reports/latest.md':'reports/latest-usupdate.md';
  }
  return tab==='morning'?('reports/morning-'+date+'.md'):('reports/usupdate-'+date+'.md');
}

function fmtTs(){
  var d=new Date();
  return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+
         d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr';
}

function setHeaderTs(extra){
  document.getElementById('ts').textContent=fmtTs()+(extra?' - '+extra:'');
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderMarkdown(md){
  if(!md){
    document.getElementById('content').innerHTML='<div class="empty">Kein Report fuer dieses Datum verfuegbar.</div>';
    document.getElementById('toc-list').innerHTML='';
    return;
  }
  // Strip box-drawing separators (UTF-8 sequences and ASCII =====)
  var cleaned=md.replace(/^[=═─━-]{6,}\s*$/gm,'---');
  var html;
  try{ html=marked.parse(cleaned); }
  catch(e){ html='<pre>'+escapeHtml(cleaned)+'</pre>'; }
  var div=document.createElement('div');
  div.innerHTML=html;
  // Inject ids on h2 for TOC navigation
  var h2s=div.querySelectorAll('h2');
  h2s.forEach(function(h,i){
    var slug='sec-'+(i+1)+'-'+h.textContent.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    h.id=slug;
  });
  document.getElementById('content').innerHTML=div.innerHTML;
  buildToc(div);
}

function buildToc(div){
  var list=document.getElementById('toc-list');
  list.innerHTML='';
  var h2s=div.querySelectorAll('h2');
  if(!h2s.length){list.innerHTML='<div style="font-size:11px;color:var(--muted);">Keine Sektionen</div>';return;}
  h2s.forEach(function(h){
    var a=document.createElement('a');
    a.href='#'+h.id;
    a.textContent=h.textContent.replace(/^\d+\.\s*/,'');
    a.onclick=function(ev){
      ev.preventDefault();
      var target=document.getElementById(h.id);
      if(target)target.scrollIntoView({behavior:'smooth',block:'start'});
      document.querySelectorAll('.toc a').forEach(function(x){x.classList.remove('active');});
      a.classList.add('active');
    };
    list.appendChild(a);
  });
}

function load(){
  setHeaderTs(STATE.tab+' - '+STATE.date);
  var url=reportPath(STATE.tab,STATE.date);
  document.getElementById('content').innerHTML='<div class="loading">Lade '+escapeHtml(url)+' ...</div>';
  fetch(url,{cache:'no-store'})
    .then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.text();
    })
    .then(function(text){renderMarkdown(text);})
    .catch(function(e){
      document.getElementById('content').innerHTML=
        '<div class="empty">Kein Report verfuegbar: '+escapeHtml(url)+'<br><br>'+
        '<span style="font-size:11px;">Fehler: '+escapeHtml(e.message)+'</span></div>';
      document.getElementById('toc-list').innerHTML='';
    });
}

function switchTab(tab){
  if(tab==='usupdate' && !STATE.usupdateAvailable){return;}
  STATE.tab=tab;
  document.getElementById('tab-morning').classList.toggle('active',tab==='morning');
  document.getElementById('tab-usupdate').classList.toggle('active',tab==='usupdate');
  load();
}

function onDateChange(){
  STATE.date=document.getElementById('date-select').value;
  load();
}

function setFilter(f){
  STATE.filter=f;
  document.querySelectorAll('.filter-btn').forEach(function(b){
    b.classList.toggle('active',b.dataset.filter===f);
  });
  // Phase 3.2 - filter logic not implemented yet
}

function toggleToc(){
  var toc=document.getElementById('toc');
  var btn=document.getElementById('toc-accordion');
  if(toc.style.display==='block'){toc.style.display='';btn.classList.remove('expanded');}
  else{toc.style.display='block';btn.classList.add('expanded');}
}

function checkUsUpdate(){
  return fetch('reports/latest-usupdate.md',{method:'HEAD',cache:'no-store'})
    .then(function(r){
      STATE.usupdateAvailable=r.ok;
      var btn=document.getElementById('tab-usupdate');
      if(r.ok){btn.classList.remove('disabled');btn.title='';}
      else{btn.classList.add('disabled');btn.title='Erscheint nach 14:45';}
    })
    .catch(function(){
      STATE.usupdateAvailable=false;
      document.getElementById('tab-usupdate').classList.add('disabled');
    });
}

function init(){
  var sel=document.getElementById('date-select');
  var dates=buildDateList();
  dates.forEach(function(d,i){
    var opt=document.createElement('option');
    opt.value=d;opt.textContent=d+(i===0?' (heute)':'');
    sel.appendChild(opt);
  });
  STATE.date=dates[0];
  checkUsUpdate().then(load);
}

init();
</script>
</body>
</html>
